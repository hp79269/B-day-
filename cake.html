<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>A Little Cake For A Special Girl 🎂</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   CAKE PAGE
========================= */

.cake-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:45px 10px;
}

.cake-card{
  width:min(900px,96%);
  text-align:center;
  padding:35px 10px 45px;
  border-radius:35px;

  background:rgba(255,255,255,.72);
  backdrop-filter:blur(15px);

  box-shadow:0 20px 60px rgba(120,80,140,.18);
}

.cake-intro{
  font-family:cursive;
  font-size:clamp(20px,4vw,27px);
  color:#8b6095;
}

.cake-card h1{
  font-size:clamp(30px,6vw,48px);
  margin:8px 0 10px;
}


/* =========================
   CAKE CONTAINER
========================= */

.cake-wrap{
  margin-top:25px;
}

.cake{
  position:relative;

  width:min(650px,95vw);
  height:410px;

  margin:50px auto 5px;

  filter:drop-shadow(
    0 22px 25px rgba(70,40,30,.22)
  );
}


/* =========================
   CAKE BODY
========================= */

.layer.bottom{

  position:absolute;

  z-index:1;

  left:5%;
  bottom:20px;

  width:90%;
  height:180px;

  border-radius:
    0 0 45% 45% /
    0 0 25% 25%;

  background:
    linear-gradient(
      to bottom,
      #fffdf7 0%,
      #f8ecdc 35%,
      #ead8bd 75%,
      #d8bea0 100%
    );

  box-shadow:
    inset 0 -20px 25px rgba(120,80,40,.12),
    0 12px 20px rgba(70,40,25,.15);
}


/* =========================
   CAKE TOP OVAL
========================= */

.layer.top{

  position:absolute;

  z-index:4;

  left:5%;
  top:55px;

  width:90%;
  height:235px;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse at 45% 35%,
      #fffefa 0%,
      #fff9ef 45%,
      #f4e3cd 100%
    );

  box-shadow:
    inset 0 8px 15px rgba(255,255,255,.95),
    inset 0 -12px 20px rgba(160,110,70,.13),
    0 8px 12px rgba(70,40,25,.15);
}


/* =========================
   PHOTO — PERFECT OVAL FIT
========================= */

.cake-photo{

  position:absolute;

  z-index:7;

  /*
     PHOTO SIZE MATCHES
     THE CAKE TOP
  */

  left:20%;
  top:72px;

  width:60%;
  height:185px;

  object-fit:cover;

  /*
     Same oval perspective
     as the cake surface
  */

  border-radius:50%;

  border:8px solid #fffdf8;

  box-shadow:
    0 2px 5px rgba(70,40,30,.20),
    inset 0 0 12px rgba(70,40,30,.10);

  /*
     Makes the image sit naturally
     inside the cake top
  */

  transform:
    perspective(900px)
    rotateX(7deg);

  transform-origin:center center;
}


/* =========================
   CREAM RING
   EXACTLY AROUND PHOTO
========================= */

.icing{

  position:absolute;

  z-index:8;

  pointer-events:none;

  left:19%;
  top:69px;

  width:62%;
  height:191px;

  border-radius:50%;

  border:9px dotted #ffffff;

  filter:
    drop-shadow(
      0 2px 3px rgba(80,50,30,.15)
    );

  transform:
    perspective(900px)
    rotateX(7deg);
}


/* Extra subtle cream line */

.icing::after{

  content:"";

  position:absolute;

  inset:3px;

  border-radius:50%;

  border:2px solid rgba(232,207,181,.7);
}


/* =========================
   CANDLES
========================= */

.candles{

  position:absolute;

  z-index:12;

  top:5px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:25px;
}

.candle{

  position:relative;

  width:17px;
  height:72px;

  border-radius:8px;

  background:
    repeating-linear-gradient(
      45deg,
      #fff 0px,
      #fff 7px,
      #d7a5df 7px,
      #d7a5df 14px
    );

  box-shadow:
    0 4px 8px rgba(60,40,40,.20);
}


/* =========================
   FLAMES
========================= */

.flame{

  position:absolute;

  left:50%;
  top:-30px;

  width:22px;
  height:30px;

  transform:translateX(-50%);

  border-radius:50% 50% 50% 50%;

  background:
    radial-gradient(
      ellipse at center,
      #fffbd0 10%,
      #ffd166 45%,
      #ff9c68 75%
    );

  box-shadow:
    0 0 10px #ffd166,
    0 0 24px rgba(255,180,60,.7);

  animation:flicker .8s infinite alternate;
}

@keyframes flicker{

  from{
    transform:
      translateX(-50%)
      scale(1)
      rotate(-3deg);
  }

  to{
    transform:
      translateX(-50%)
      scale(1.12)
      rotate(3deg);
  }
}


/* =========================
   CAKE SIDE DECORATION
========================= */

.layer.bottom::after{

  content:"♡   ✦   ♡   ✦   ♡";

  position:absolute;

  left:0;
  right:0;
  bottom:45px;

  text-align:center;

  color:rgba(255,255,255,.9);

  font-size:25px;

  letter-spacing:8px;
}


/* =========================
   HINT
========================= */

.hint{

  color:#806286;

  font-size:16px;

  margin:18px 0;
}

#wishBtn{
  border:none;
  cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .cake-card{
    padding:30px 4px 40px;
  }

  .cake{
    width:100%;
    height:340px;

    margin-top:35px;

    transform:scale(.92);
    transform-origin:top center;

    margin-bottom:-25px;
  }

  /*
     PHOTO REMAINS
     PROPERLY ALIGNED
  */

  .cake-photo{

    left:20%;

    top:69px;

    width:60%;

    height:154px;

    border-width:6px;

  }

  .icing{

    left:19%;

    top:66px;

    width:62%;

    height:160px;

    border-width:7px;
  }

  .candles{
    gap:15px;
  }

  .candle{
    width:13px;
    height:57px;
  }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

  .cake{
    transform:scale(.82);
    margin-bottom:-60px;
  }

}

</style>
</head>


<body>

<div class="floating f1">🦋</div>

<main class="cake-page">

<div class="cake-card">

  <div class="cake-intro">
    Make a wish, Chotu… 💜
  </div>

  <h1>
    A Little Cake For A Special Girl 🎂
  </h1>


  <div class="cake-wrap">

    <div class="cake">


      <!-- CAKE BODY -->
      <div class="layer bottom"></div>


      <!-- CAKE TOP -->
      <div class="layer top"></div>


      <!-- PHOTO INSIDE CAKE -->
      <img
        class="cake-photo"
        src="photo1.jpg"
        alt="Heni"
      >


      <!-- CREAM AROUND PHOTO -->
      <div class="icing"></div>


      <!-- CANDLES -->
      <div class="candles">

        <div class="candle">

        </div>

        <div class="candle">

        </div>

        <div class="candle">
          <span class="flame"></span>
        </div>

        <div class="candle">
          <span class="flame"></span>
        </div>

        <div class="candle">

      </div>

    <p class="hint">

    </p>


    <button class="btn" id="wishBtn">
      Blow Them All Out ✨
    </button>

  </div>


  <br><br>

  <a class="btn" href="surprise.html">
    Make My Wish ✨ →
  </a>

</div>

</main>


<footer>
  Made with ♡ specially for Chotu 😎
</footer>
