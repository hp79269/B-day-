<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>A Little Cake For A Special Girl 🎂</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==============================
   CAKE PAGE
================================ */

.cake-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:50px 12px;
}

.cake-card{
  width:min(900px,96%);
  text-align:center;
  padding:35px 10px 45px;
  border-radius:35px;

  background:rgba(255,255,255,.72);
  backdrop-filter:blur(15px);

  box-shadow:0 20px 60px rgba(130,80,150,.18);
}

.cake-intro{
  font-family:cursive;
  font-size:clamp(20px,4vw,27px);
  color:#8c6095;
}

.cake-card h1{
  font-size:clamp(30px,6vw,48px);
  margin:8px 0 5px;
}


/* ==============================
   BIG REALISTIC CSS CAKE
================================ */

.cake-wrap{
  margin-top:30px;
}

.cake{
  position:relative;

  /* LARGE CAKE */
  width:min(650px,94vw);
  height:390px;

  margin:55px auto 10px;

  filter:drop-shadow(
    0 22px 25px rgba(80,45,40,.22)
  );
}


/* ==============================
   CAKE SIDE
================================ */

.cake .layer.bottom{

  position:absolute;

  width:88%;
  height:170px;

  left:6%;
  bottom:25px;

  border-radius:
    0 0 48% 48% /
    0 0 30% 30%;

  background:
    linear-gradient(
      to bottom,
      #fffdf6 0%,
      #f9eee0 35%,
      #ead7bf 75%,
      #d9c0a1 100%
    );

  box-shadow:
    inset 0 -18px 25px rgba(130,90,50,.12),
    0 12px 18px rgba(80,50,30,.15);
}


/* Cake side cream decoration */

.cake .layer.bottom::before{

  content:"";

  position:absolute;

  left:0;
  top:15px;

  width:100%;
  height:35px;

  background:
    radial-gradient(
      ellipse,
      #fff 0%,
      #fff 55%,
      transparent 57%
    );

  background-size:45px 25px;
}


/* ==============================
   CAKE TOP
================================ */

.cake .layer.top{

  position:absolute;

  z-index:3;

  width:88%;
  height:225px;

  left:6%;
  top:35px;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #fffef9,
      #f7e9d7
    );

  box-shadow:

    inset 0 8px 15px rgba(255,255,255,.9),

    inset 0 -12px 18px rgba(170,120,80,.12),

    0 8px 12px rgba(70,40,25,.16);
}


/* ==============================
   PHOTO INSIDE CAKE
================================ */

.cake-photo{

  position:absolute;

  z-index:6;

  width:62%;
  height:185px;

  left:19%;
  top:55px;

  object-fit:cover;

  /*
     Makes photo look like it is
     printed on the cake surface
  */

  border-radius:50%;

  border:8px solid #fff;

  box-shadow:
    0 2px 5px rgba(70,40,30,.15),
    inset 0 0 10px rgba(80,50,30,.12);

  background:#f5e9dc;
}


/* ==============================
   CREAM RING AROUND PHOTO
================================ */

.cake .icing{

  position:absolute;

  z-index:7;

  width:66%;
  height:197px;

  left:17%;
  top:49px;

  border-radius:50%;

  border:10px dotted #fff;

  pointer-events:none;

  filter:
    drop-shadow(
      0 2px 3px rgba(80,50,30,.12)
    );
}


/* ==============================
   EXTRA CAKE CREAM DOTS
================================ */

.cake .icing::before{

  content:"";

  position:absolute;

  width:100%;
  height:100%;

  border-radius:50%;

  border:3px solid rgba(239,216,190,.7);
}


/* ==============================
   CANDLES
================================ */

.candles{

  position:absolute;

  z-index:12;

  top:-5px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:25px;
}

.candle{

  position:relative;

  width:17px;
  height:70px;

  border-radius:8px;

  background:
    repeating-linear-gradient(
      45deg,
      #fff,
      #fff 7px,
      #d9a6df 7px,
      #d9a6df 14px
    );

  box-shadow:
    0 4px 8px rgba(60,40,40,.2);
}


/* ==============================
   FLAME
================================ */

.flame{

  position:absolute;

  width:23px;
  height:31px;

  left:50%;
  top:-29px;

  transform:translateX(-50%);

  border-radius:
    50% 50% 50% 50%;

  background:
    radial-gradient(
      ellipse at center,
      #fffbd0 10%,
      #ffd166 45%,
      #ff9d68 75%
    );

  box-shadow:
    0 0 10px #ffd166,
    0 0 25px rgba(255,180,60,.7);

  animation:flicker .8s infinite alternate;
}

@keyframes flicker{

  from{
    transform:
      translateX(-50%)
      scale(1)
      rotate(-3deg);
  }

  to{
    transform:
      translateX(-50%)
      scale(1.13)
      rotate(3deg);
  }
}


/* ==============================
   CAKE DECORATIONS
================================ */

.cake::before{

  content:"♡";

  position:absolute;

  z-index:10;

  left:10%;
  bottom:70px;

  font-size:45px;

  color:white;

  opacity:.8;
}

.cake::after{

  content:"✦";

  position:absolute;

  z-index:10;

  right:10%;
  bottom:70px;

  font-size:38px;

  color:white;

  opacity:.8;
}


/* ==============================
   TEXT
================================ */

.hint{

  color:#806286;

  font-size:16px;

  margin:15px 0 18px;
}

#wishBtn{
  border:none;
  cursor:pointer;
}


/* ==============================
   MOBILE
================================ */

@media(max-width:600px){

  .cake-card{
    padding:30px 5px 40px;
  }

  .cake{

    width:100%;

    height:340px;

    transform:scale(.9);

    transform-origin:
      center top;

    margin-bottom:-20px;
  }

  .cake-photo{

    width:61%;
    height:160px;

    top:57px;

    border-width:6px;
  }

  .cake .icing{

    width:65%;
    height:172px;

    left:17.5%;
    top:51px;

    border-width:7px;
  }

  .candles{
    gap:15px;
  }

  .candle{
    width:13px;
    height:58px;
  }

}

</style>
</head>


<body>

<!-- Floating decorations -->
<div class="floating f1">🦋</div>
<div class="floating f2">♡</div>
<div class="floating f3">🌸</div>
<div class="floating f4">✨</div>


<!-- Navigation -->
<nav>
  <a href="index.html">♡ Home</a>
  <a href="message.html">Message</a>
  <a href="memories.html">Memories</a>
  <a href="cake.html">Cake</a>
  <a href="surprise.html">Surprise</a>
</nav>


<main class="cake-page">

<div class="cake-card">

  <div class="cake-intro">
    Make a wish, Chotu… 💜
  </div>

  <h1>
    A Little Cake For A Special Girl 🎂
  </h1>


  <!-- =========================
       CAKE
  ========================== -->

  <div class="cake-wrap">

    <div class="cake">

      <!-- Candles -->
      <div class="candles">

        <div class="candle">
          <span class="flame"></span>
        </div>

        <div class="candle">
          <span class="flame"></span>
        </div>

        <div class="candle">
          <span class="flame"></span>
        </div>

        <div class="candle">
          <span class="flame"></span>
        </div>

        <div class="candle">
          <span class="flame"></span>
        </div>

      </div>


      <!-- Cake top -->
      <div class="layer top"></div>


      <!-- ONLY PHOTO USED -->
      <img
        class="cake-photo"
        src="photo1.jpg"
        alt="Heni"
      >


      <!-- Cream around photo -->
      <div class="icing"></div>


      <!-- Cake body -->
      <div class="layer bottom"></div>

    </div>


    <p class="hint">
      Tap each flame to blow out the candles 🕯️✨
    </p>


    <button class="btn" id="wishBtn">
      Blow Them All Out ✨
    </button>

  </div>


  <br><br>


  <a class="btn" href="surprise.html">
    Make My Wish ✨ →
  </a>

</div>

</main>


<footer>
  Made with ♡ specially for Chotu 😎
</footer>


<script src="script.js"></script>

</body>
</html>
